# Pytest configuration for AI Customer Support Integration

[pytest]

# Project root ko Python import path mein add karein
pythonpath = .

# Test files ki location
testpaths = tests

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Default test output
addopts = -v --strict-markers

# Custom test markers
markers =
    unit: Unit tests for individual components
    integration: Integration tests for external services and modules
    workflow: Tests for customer support workflows
